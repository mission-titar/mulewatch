name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A markdown-only push (a handoff or other doc) changes no image, so skip the whole
    # rebuild-sign-attest release when every file in the push is markdown.
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  # Full gate + per-arch build/integration/push-by-digest (push: true). Both images are
  # pushed by digest only; no consumable tag exists yet.
  validate:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/validate.yml
    with:
      push: true

  # Fan-in, one leg per image: combine its per-arch digests into one multi-arch manifest and tag
  # it. fail-fast is off so a failing leg never cancels the other halfway through signing.
  # A consumable tag, its signature, and its attestations are all published only AFTER the VEX
  # honesty gate below passes. `validate` (build + integration) has already succeeded, and the
  # per-arch layers exist in ghcr by digest only (no tag, no signature), so nothing a consumer
  # can trust is ever published for an image whose VEX claims fail.
  publish-manifest:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless OIDC for cosign sign/attest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: crawler
            image: ghcr.io/mission-titar/p2pwatch
          - package: amule
            image: ghcr.io/mission-titar/p2pwatch-amule
    env:
      IMAGE: ${{ matrix.image }}
      VEX: security/${{ matrix.package }}.vex.openvex.json
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and sync the dev environment
        uses: ./.github/actions/setup-uv-env
        with:
          save-cache: 'false'  # restore only; validate is the x86 cache writer

      - name: Download the per-arch image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.package }}-*
          path: /tmp/digests
          merge-multiple: true

      # A second copy of just the amd64 digest, isolated, so the pre-publish SBOM scans the amd64
      # image specifically. This runner is amd64, and each per-arch digest is a single-platform
      # index (buildx wraps the image with its provenance attestation): Syft would fail on the
      # arm64 index with "no child with platform linux/amd64". The merged /tmp/digests above keeps
      # both arches for the manifest-list creation later.
      - name: Download the amd64 digest for the pre-publish SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.package }}-amd64
          path: /tmp/amd64-digest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` is the newest release. Not `{{is_default_branch}}`, which is true on a branch
          # push and false on a tag push, so it pinned `latest` to the tip of main.
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # --- Pre-publish VEX honesty gate ------------------------------------------------------
      # The per-arch images already exist in ghcr by digest (pushed, gated behind integration,
      # by the `validate` job). We generate the SBOM from the amd64 digest so the three VEX
      # checks below run BEFORE any consumable tag, signature, or attestation is published. Our
      # two arches share one Dockerfile and identical dpkg/python versions, so the amd64 SBOM
      # carries the same package set the arm64 image would. Staleness is deliberately NOT gated
      # here: a suppressed CVE that Grype stops reporting has been fixed upstream, which never
      # makes the image less safe. The daily grype-scan surfaces it as a non-blocking SARIF
      # signal so the VEX gets pruned, without failing a release.

      - name: Resolve the amd64 image reference to scan before publishing
        id: prepublish
        working-directory: /tmp/amd64-digest
        run: |
          digest=$(ls | head -1)
          echo "ref=${{ env.IMAGE }}@sha256:${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate the Syft-JSON SBOM (native, for the checks and the VEX-aware daily scan)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_SELECT_CATALOGERS: +sbom-cataloger
        with:
          image: ${{ steps.prepublish.outputs.ref }}
          format: syft-json
          output-file: /tmp/sbom.syft.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the CycloneDX SBOM (portable, for external consumers)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_SELECT_CATALOGERS: +sbom-cataloger
        with:
          image: ${{ steps.prepublish.outputs.ref }}
          format: cyclonedx-json
          output-file: /tmp/sbom.cyclonedx.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # aMule is declared by a file only the sbom-cataloger reads, and that cataloger is off unless
      # selected (the SYFT_SELECT_CATALOGERS above): a regression is SILENT, Grype scores it zero.
      - name: Gate that aMule is in the SBOM under its CPE-matching declaration
        if: matrix.package == 'amule'
        run: |
          for sbom in /tmp/sbom.syft.json /tmp/sbom.cyclonedx.json; do
            if ! grep -q '"pkg:generic/amule@' "$sbom"; then
              echo "::error::no pkg:generic/amule in $sbom: either the sbom-cataloger did not run"
              echo "::error::(SYFT_SELECT_CATALOGERS=+sbom-cataloger) or the image lost its"
              echo "::error::/usr/local/share/amule/amule.cdx.json. Grype would score aMule zero."
              exit 1
            fi
          done

      - name: Gate that our source never reaches the exempted code paths
        run: uv run poe vex-source-claims

      - name: Gate that every VEX claim maps to a guard and back
        run: uv run poe vex-claim-coverage

      - name: Gate that image-family VEX claims hold against the SBOM
        run: >
          uv run python -m vex_guards.check_image_claims
          --sbom /tmp/sbom.syft.json
          --vex "$VEX"
          --format fail

      # --- Publish (reached only when every gate above passed) -------------------------------

      - name: Create the multi-arch manifest list and push the tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # The signature and attestations bind to the pushed index digest (not a tag): every tag
      # pointing at this digest inherits them. imagetools inspect resolves the tag to the
      # multi-arch index descriptor; .Manifest.Digest is that index's digest.
      - name: Capture the pushed index digest
        id: digest
        run: |
          ref="${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          echo "ref=${{ env.IMAGE }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # --recursive signs the index AND each child manifest, so verification works both by tag
      # (-> index) and by arch digest (-> child). attest has no recursive form; the three
      # attestations below bind to the index only (consistent with the single-platform SBOM,
      # see spec 2026-07-07-supply-chain-attestation-vex section 11).
      - name: Sign the image (keyless OIDC, recursive over the index)
        run: cosign sign --yes --recursive "${{ steps.digest.outputs.ref }}"

      - name: Attest the SBOMs and the VEX (keyless OIDC)
        run: |
          ref='${{ steps.digest.outputs.ref }}'
          cosign attest --yes --type cyclonedx \
            --predicate /tmp/sbom.cyclonedx.json "$ref"
          cosign attest --yes --type https://syft.dev/bom \
            --predicate /tmp/sbom.syft.json "$ref"
          cosign attest --yes --type openvex \
            --predicate "$VEX" "$ref"

      - name: Inspect the published manifest
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # The GitHub release page, written from the annotated tag once both images are signed and
  # attested: `needs` on a matrix job waits for every leg.
  github-release:
    needs: publish-manifest
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checkout fetches the tag as a bare commit ref: its message would read as the commit's.
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      # Not --notes-from-tag: the API's tag message carries the SSH signature block.
      - name: Create the release from the tag message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$(git tag -l "$GITHUB_REF_NAME" --format='%(contents:subject)')" \
            --notes "$(git tag -l "$GITHUB_REF_NAME" --format='%(contents:body)')"
