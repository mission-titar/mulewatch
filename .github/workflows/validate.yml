name: Validate

on:
  workflow_call:
    inputs:
      push:
        description: If true, the build-and-verify job also pushes the image to ghcr by digest.
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mission-titar/mulewatch

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-env
      - name: Static checks
        run: uv run poe lint-all

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-env
        with:
          save-cache: 'false'  # lint is the x86 cache writer; test restores only
      - name: Unit tests
        run: uv run poe test

  # One job per arch on its native runner: build the image (loaded locally, and pushed
  # by digest when inputs.push), run the compose smoke stack and the daemon-facing suites
  # against the local image, then upload the digest for the release merge. The push exporter runs during the build, but
  # only publish-manifest publishes a tag, and it is downstream of this job's integration
  # step, so no tag ever references an image that failed integration.
  build-and-verify:
    needs: [lint, test]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      # fetch-depth: 0 fetches the full history AND tags: the version step below derives the
      # product version from the pushed git tag, which a shallow checkout would not see. The
      # lint/test jobs stay shallow (their derived version is irrelevant).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
        with:
          # One uv-cache writer per runner arch: arm64 (the sole arm64 job) saves; amd64
          # restores lint's x86 cache. Avoids concurrent same-key saves → no cache warning.
          save-cache: ${{ matrix.arch == 'arm64' }}
      # Compute the product version once, the same way a local build would (hatch-vcs over the
      # tag). Injected into the image as the VERSION build-arg -> installed wheel metadata +
      # OCI label. hatch prints "Inspecting build dependencies" to stderr; the version is the
      # sole stdout line. On main/PR (no release tag at HEAD) this is a dev version like
      # 0.19.2.devN+g<sha>; on a vX.Y.Z tag push it is X.Y.Z.
      - name: Compute the product version from the git tag
        id: version
        run: |
          echo "value=$(cd packages/crawler && uvx --quiet --with hatch-vcs hatch version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the crawler image (${{ matrix.arch }})
        id: crawler
        uses: ./.github/actions/docker-image
        with:
          package: crawler
          platform: linux/${{ matrix.arch }}
          image: ${{ env.IMAGE }}
          local-tag: ci-${{ github.sha }}
          push: ${{ inputs.push }}
          cache-scope: crawler-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
      - name: Read the aMule version pin
        id: amule
        run: |
          version=$(sed -n 's/^ARG AMULE_VERSION=//p' packages/crawler/Dockerfile)
          if [ -z "$version" ]; then
            echo "::error::no ARG AMULE_VERSION=<version> line in packages/crawler/Dockerfile"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      # A builder without git, or a checkout without the tag, still builds but says "GIT".
      - name: Check that the aMule binaries report the pinned version (${{ matrix.arch }})
        env:
          AMULE_VERSION: ${{ steps.amule.outputs.value }}
          LOCAL_IMAGE: ${{ env.IMAGE }}:ci-${{ github.sha }}
        # --version exits 255 even on success, so only its output is checked.
        run: |
          amuled=$(docker run --rm --entrypoint amuled "$LOCAL_IMAGE" --version || true)
          amuleapi=$(docker run --rm --entrypoint amuleapi "$LOCAL_IMAGE" --version || true)
          echo "$amuled"
          echo "$amuleapi"
          grep -qF "aMuleD $AMULE_VERSION compiled" <<< "$amuled"
          grep -qF "amuleapi $AMULE_VERSION compiled" <<< "$amuleapi"
      # The same action, Syft and cataloger selection as release.yml, so a PR proves what a
      # release will attest. The sbom-cataloger is not an image cataloger: off unless selected.
      - name: Generate the SBOM of the local image (${{ matrix.arch }})
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SELECT_CATALOGERS: +sbom-cataloger
        with:
          image: docker:${{ env.IMAGE }}:ci-${{ github.sha }}
          format: syft-json
          output-file: /tmp/sbom.syft.json
          upload-artifact: "false"
          upload-release-assets: "false"
      - name: Check that aMule is in the SBOM at the pinned version (${{ matrix.arch }})
        env:
          AMULE_VERSION: ${{ steps.amule.outputs.value }}
        run: |
          if ! grep -qF "\"pkg:generic/amule@${AMULE_VERSION}\"" /tmp/sbom.syft.json; then
            echo "::error::no pkg:generic/amule@${AMULE_VERSION} in the SBOM: the declaration"
            echo "::error::file is missing or stale, or the sbom-cataloger was not selected."
            exit 1
          fi
      - name: Compose smoke stack integration (${{ matrix.arch }})
        run: ( cd packages/crawler && uv run pytest -m compose_integration --no-cov -q )
        env:
          IMAGE_TAG: ci-${{ github.sha }}
      # amuleapi ships with aMule, so the daemon these three suites drive is now the image
      # this job just built rather than a third-party one. Same configs as the smoke stack: the
      # crawler service needs them to stay up, and `finish` stops the container if it does not.
      - name: Start a throwaway daemon (${{ matrix.arch }})
        run: |
          docker run -d --rm --name amuled -p 4711:4711 \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e AMULE_EC_PASSWORD=indexer-ec-test -e AMULE_API_PASSWORD=indexer-api-test \
            -v "$PWD/tests/smoke/crawler.yml:/app/config/crawler.yml:ro" \
            -v "$PWD/tests/smoke/targets.yml:/app/config/targets.yml:ro" \
            -v "$PWD/deploy/matcher.yml:/app/config/matcher.yml:ro" \
            "$IMAGE:ci-${{ github.sha }}"
          for _ in $(seq 1 90); do
            # `if`, not `&&`: the step runs under `set -e`, where a bare failing curl aborts it.
            if curl -fsS http://127.0.0.1:4711/api/v1/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::amuleapi never answered on /api/v1/health"
          docker logs amuled
          exit 1
      - name: API, download and orchestration integration (${{ matrix.arch }})
        run: |
          cd packages/crawler
          uv run pytest \
            -m "api_integration or download_integration or orchestration_integration" --no-cov -q
        env:
          MULEWATCH_TEST_API_HOST: 127.0.0.1
          MULEWATCH_TEST_API_PORT: '4711'
          MULEWATCH_TEST_API_PASSWORD: indexer-api-test
      - name: Stop the throwaway daemon (${{ matrix.arch }})
        if: ${{ always() }}
        run: docker rm -f amuled || true
      - name: Export the digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${CRAWLER_DIGEST#sha256:}"
        env:
          CRAWLER_DIGEST: ${{ steps.crawler.outputs.digest }}
      - name: Upload the crawler digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Single aggregation gate for branch protection: require only `validate / gate` instead of the
  # individual (matrix-suffixed) job checks, stable when jobs/matrix legs change. `if: always()`
  # is essential: GitHub treats a *skipped* required check as passing, so the gate must always run
  # and fail explicitly rather than be skipped when an upstream job fails.
  gate:
    needs: [lint, test, build-and-verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All validation jobs must succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Validation job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required validation job reported '$r'"; exit 1; }
          done
          echo "All validation jobs succeeded."
