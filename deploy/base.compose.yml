# Shared service definition, pulled into compose.yml and gluetun.compose.yml with `extends:`.
# Each stack adds its own `ports:`; this file declares none.

services:
  p2pwatch:
    image: ghcr.io/mission-titar/p2pwatch:latest
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 2g
    restart: unless-stopped
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      AMULE_EC_PASSWORD: ${AMULE_EC_PASSWORD:?}
      AMULE_API_PASSWORD: ${AMULE_API_PASSWORD:?}
    volumes:
      - ./crawler.yml:/app/config/crawler.yml:ro
      - ./targets.yml:/app/config/targets.yml:ro
      - ./matcher.yml:/app/config/matcher.yml:ro
      - ./amule:/home/amule/.aMule
      - ./data:/data
      - ./downloads:/downloads
    # s6-svstat exits 0 for a stopped service too, so test what it prints, not its exit code.
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(s6-svstat -u /etc/services.d/amuled)" = true']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
