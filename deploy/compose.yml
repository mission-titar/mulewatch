# Default stack: no VPN, one container on the default network.
# Low-ID by default; for High-ID, forward 4662 (TCP and UDP) from your router to this machine.
# Run (from deploy/):
#   docker compose up -d
name: p2pwatch

services:
  p2pwatch:
    extends:
      file: base.compose.yml
      service: p2pwatch
    # Change the left-hand number if a port is already taken on this machine.
    # 8080 (the catalog) has NO password: put it behind a reverse proxy or a VPN.
    # 4711 (aMule's own web UI) is protected by AMULE_API_PASSWORD.
    ports:
      - "8080:8080"
      - "4711:4711"
      - "4662:4662"
      - "4662:4662/udp"
