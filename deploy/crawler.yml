# Crawler config, version-controlled. Secrets via ${VAR} (.env), the rest in clear text.
# Set download.enabled to false for a crawl-only node (no download, catalog only).

cycle_interval_seconds: 300.0
search_poll_budget_seconds: 30.0
search_poll_interval_seconds: 5.0
keyword_pause_min_seconds: 1.0
keyword_pause_max_seconds: 4.0
decision_poll_interval_seconds: 5.0
shutdown_deadline_seconds: 10.0

amule_api_password: ${AMULE_API_PASSWORD}

backoff:
  base_seconds: 2.0
  cap_seconds: 300.0
  factor: 2.0
  jitter_ratio: 0.3

search:
  keywords: [keroro, titar]

catalog_db_path: /data/catalog.db
local_db_path: /data/local.db

# Read-only webui served in-process by the crawler (own thread). The bind is fixed at
# 0.0.0.0:8080 in code; no built-in auth -> front it with the reverse proxy / VPN.
# enabled: false => headless crawler, no HTTP surface.
webui:
  enabled: true
  # Resolved by the BROWSER, not the container: localhost only works when the browser runs on
  # the Docker host. Set it to the reachable address otherwise (NAS hostname, reverse proxy).
  amule_url: http://localhost:4711

observability:
  log_level: INFO
  metrics: { enabled: true, port: 9090 }
  notification_timeout_seconds: 5.0
  # notifications:
  #   - url: "discord://${DISCORD_WEBHOOK_ID}/${DISCORD_WEBHOOK_TOKEN}"
  #     tag: operations
  #   # Findings for researchers; the embed's author line already names the node.
  #   - url: "discord://${DISCORD_COMMUNITY_ID}/${DISCORD_COMMUNITY_TOKEN}"
  #     tag: community
  #     node_prefix: false

download:
  enabled: true
  poll_interval_seconds: 30.0
  # Free-space floor on output_dir: a candidate is deferred when free space minus what amuled
  # still has to transfer minus its own size would fall below it. 10 GiB.
  min_free_bytes: 10737418240
  # A queued/downloading entry amuled has not shown for this long becomes failed. An entry
  # stays in amuled's queue even with zero sources, so absence really does mean gone.
  lost_after_seconds: 86400
  # Measured with statvfs, never read. amuled writes incoming/ and temp/ under it.
  output_dir: /downloads

# Port-sync only works under the gluetun stack: mulewatch shares gluetun's network namespace,
# so its control server is on localhost. Flip enabled to true there, with VPN_PORT_FORWARDING=on.
# The restart is now `s6-svc -r` on amuled inside the container, so there is no URL for it.
port_sync:
  enabled: false
  poll_interval_seconds: 60.0
  restart_min_interval_seconds: 300.0
  gluetun_control_url: http://localhost:8000
