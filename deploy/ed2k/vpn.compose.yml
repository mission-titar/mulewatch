# aMule inside gluetun's network; the core stays outside the tunnel.
# For High-ID, set VPN_PORT_FORWARDING=on in .env: it also turns port-sync on.

services:
  ed2k-gluetun:
    image: qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"none"}'
    # ed2k has no network of its own: the core reaches it at ed2k:4711 through this alias.
    networks:
      default:
        aliases: [ed2k]
    # 4711 (aMule's own web UI) is protected by AMULE_API_PASSWORD.
    ports:
      - "4711:4711"
    restart: unless-stopped

  ed2k:
    extends:
      file: service.compose.yml
      service: ed2k
    # Here and not in the fragment: `extends:` never carries depends_on over.
    network_mode: "service:ed2k-gluetun"
    depends_on: [ed2k-gluetun]
    environment:
      PORT_SYNC: ${VPN_PORT_FORWARDING:-off}
