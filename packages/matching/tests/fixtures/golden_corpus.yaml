    filename: "[TV] KERORO MISSION TITAR N°076B « Emmène-moi sur la lune 2 » [Dimanche 05 octobre 2008 à 11H10 sur TELETOON].avi"
    decisions:
      - { target_id: 076A, tier: download, rule_name: title_confirmed }

