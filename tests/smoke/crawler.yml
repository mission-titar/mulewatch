# SMOKE crawler.yml: download mode (download.enabled: true), short intervals.
keyword_pause_min_seconds: 0.1
keyword_pause_max_seconds: 0.5
decision_poll_interval_seconds: 2.0
shutdown_deadline_seconds: 5.0

amule_api_password: ${AMULE_API_PASSWORD}

backoff:
  base_seconds: 1.0
  cap_seconds: 10.0
  factor: 2.0
  jitter_ratio: 0.3

search:
  keywords: [keroro, titar]

catalog_db_path: /data/catalog.db
local_db_path: /data/local.db

# webui served in-process by the crawler, on a bind fixed at 0.0.0.0:8080 in code.
webui:
  enabled: true

download:
  enabled: true
  poll_interval_seconds: 3.0
  # Free-space floor on output_dir: a candidate is deferred when free space minus what amuled
  # still has to transfer minus its own size would fall below it. 10 GiB.
  min_free_bytes: 10737418240
  # A queued/downloading entry amuled has not shown for this long becomes failed. An entry
  # stays in amuled's queue even with zero sources, so absence really does mean gone.
  lost_after_seconds: 86400
  # Measured with statvfs, never read. amuled writes incoming/ and temp/ under it.
  output_dir: /downloads
